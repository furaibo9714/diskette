name: Feature request
description: Suggest a new capability or an improvement to an existing one
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        If the idea is still vague, start a
        [Discussion](https://github.com/furaibo9714/diskette/discussions) instead and open an
        issue once it's concrete enough to build.

        The [roadmap](https://github.com/furaibo9714/diskette#roadmap) lists what's already
        planned, so check there first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: >-
        Describe the situation you run into, not the solution you have in mind. Knowing the
        underlying problem sometimes leads to a better fix than the one you had in mind.
      placeholder: >-
        When my Floppy server is unreachable, marking an episode watched silently does nothing
        and I don't find out until I check the server later.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
      placeholder: >-
        Queue the action locally and retry when the server comes back, with some indication in
        the UI that there's unsynced work pending.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - Progress
        - Discover / search
        - Collection (My Shows, Watchlist, Hidden, Lists)
        - Show or movie details
        - Floppy sync
        - Settings
        - Widgets or notifications
        - Something else / spans several
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: >-
        Including any workaround you're using today, and why it isn't good enough.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions and this isn't a duplicate
          required: true
