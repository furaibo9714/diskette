name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  verify-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run ktlint
        run: curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint && chmod a+x ktlint && ./ktlint

  verify-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write placeholder build properties
        run: |
          echo 'tmdbApiKey="ci-placeholder"' > local.properties
          touch app/keystore.properties

      - name: Compile debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Compile instrumented tests
        run: ./gradlew :data-local:compileDebugAndroidTestKotlin

  release:
    needs: [ verify-lint, verify-tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only the release build needs real credentials: the signing keystore, and the TMDB key in
      # local.properties. Both come out of the encrypted blobs in .github/.
      - name: Decrypt secrets
        run: ./.github/scripts/decrypt_secrets.sh
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}

      - name: Build APK
        run: ./gradlew app:assembleRelease

      - name: Github Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          body_path: app/src/main/assets/release_notes.txt
